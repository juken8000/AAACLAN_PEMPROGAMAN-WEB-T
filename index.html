<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sistem Pengelolaan Kost | Admin Panel</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-building"></i>
            <h2>KostHub</h2>
            <p>Sistem Manajemen Kost Modern</p>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="admin" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-arrow-right-to-bracket"></i> Masuk Dashboard</button>
        </form>
        <div class="demo-cred">
            <i class="fas fa-info-circle"></i> Demo login: <strong>admin</strong> / <strong>admin123</strong><br>
            (atau bebas, sistem siap pakai)
        </div>
    </div>
</div>

<!-- DASHBOARD APP (hidden) -->
<div id="dashboardApp" class="dashboard-app">
    <div class="app-wrapper">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-home"></i> KostHub</h3>
                <p>Panel Admin</p>
            </div>
            <div class="nav-menu">
                <div class="nav-item active" data-page="dashboard">
                    <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
                </div>
                <div class="nav-item" data-page="kamar">
                    <i class="fas fa-door-open"></i> <span>Kelola Kamar</span>
                </div>
                <div class="nav-item" data-page="penyewa">
                    <i class="fas fa-users"></i> <span>Penyewa</span>
                </div>
                <div class="nav-item" data-page="transaksi">
                    <i class="fas fa-coins"></i> <span>Transaksi</span>
                </div>
            </div>
            <div class="logout-btn" id="logoutSidebar">
                <i class="fas fa-sign-out-alt"></i> <span>Keluar</span>
            </div>
        </div>

        <!-- MAIN CONTENT (area dinamis) -->
        <div class="main-content" id="mainContent">
            <div style="text-align:center; padding:2rem;">Memuat data...</div>
        </div>
    </div>
</div>

<script>
    
    let kostData = {
        kamar: [],
        penyewa: [],
        transaksi: []
    };

   
    const defaultKamar = [
        { id: "k1", nomor: "A1", harga: 550000, status: "terisi", penyewaId: "p1" },
        { id: "k2", nomor: "A2", harga: 550000, status: "terisi", penyewaId: "p2" },
        { id: "k3", nomor: "B1", harga: 600000, status: "kosong", penyewaId: null },
        { id: "k4", nomor: "B2", harga: 600000, status: "terisi", penyewaId: "p3" }
    ];
    const defaultPenyewa = [
        { id: "p1", nama: "Arkhan Al-Hakim", noHp: "081234567890", kamarId: "k1", tglMasuk: "2026-01-10" },
        { id: "p2", nama: "Althaf zabran ", noHp: "082345678901", kamarId: "k2", tglMasuk: "2026-02-01" },
        { id: "p3", nama: "Alfin lambok ", noHp: "083456789012", kamarId: "k4", tglMasuk: "2026-02-15" }
    ];
    const defaultTransaksi = [
        { id: "t1", penyewaId: "p1", bulan: "Maret 2026", jumlah: 550000, status: "Lunas", tglBayar: "2026-03-05" },
        { id: "t2", penyewaId: "p2", bulan: "Maret 2026", jumlah: 550000, status: "Lunas", tglBayar: "2026-03-10" },
        { id: "t3", penyewaId: "p3", bulan: "Maret 2026", jumlah: 600000, status: "Belum Lunas", tglBayar: null }
    ];

    function loadData() {
        const stored = localStorage.getItem("kostManager");
        if(stored) {
            kostData = JSON.parse(stored);
        } else {
            kostData = { kamar: defaultKamar, penyewa: defaultPenyewa, transaksi: defaultTransaksi };
            saveData();
        }
        
        kostData.kamar.forEach(kamar => {
            const adaPenyewa = kostData.penyewa.some(p => p.kamarId === kamar.id);
            kamar.status = adaPenyewa ? "terisi" : "kosong";
            if(adaPenyewa) {
                const p = kostData.penyewa.find(p => p.kamarId === kamar.id);
                kamar.penyewaId = p.id;
            } else {
                kamar.penyewaId = null;
            }
        });
        saveData();
    }

    function saveData() {
        localStorage.setItem("kostManager", JSON.stringify(kostData));
    }

    
    function getKamarById(id) { return kostData.kamar.find(k => k.id === id); }
    function getPenyewaById(id) { return kostData.penyewa.find(p => p.id === id); }
    
    let currentPage = "dashboard";

    function render() {
        const container = document.getElementById("mainContent");
        if(!container) return;
        if(currentPage === "dashboard") renderDashboard(container);
        else if(currentPage === "kamar") renderKamarPage(container);
        else if(currentPage === "penyewa") renderPenyewaPage(container);
        else if(currentPage === "transaksi") renderTransaksiPage(container);
    }
    function renderDashboard(container) {
        const totalKamar = kostData.kamar.length;
        const terisi = kostData.kamar.filter(k => k.status === "terisi").length;
        const kosong = totalKamar - terisi;
        const bulanIni = new Date().toLocaleString('id', { month: 'long', year: 'numeric' });
        const pendapatanBulanIni = kostData.transaksi.filter(t => t.bulan === bulanIni && t.status === "Lunas")
                                    .reduce((sum, t) => sum + t.jumlah, 0);
        
        const html = `
            <div class="stats-grid">
                <div class="stat-card"><h4><i class="fas fa-bed"></i> Total Kamar</h4><div class="stat-number">${totalKamar}</div><div class="stat-desc">Seluruh kamar</div></div>
                <div class="stat-card"><h4><i class="fas fa-user-check"></i> Kamar Terisi</h4><div class="stat-number">${terisi}</div><div class="stat-desc">${Math.round(terisi/totalKamar*100)}% okupansi</div></div>
                <div class="stat-card"><h4><i class="fas fa-door-closed"></i> Kamar Kosong</h4><div class="stat-number">${kosong}</div><div class="stat-desc">Tersedia</div></div>
                <div class="stat-card"><h4><i class="fas fa-money-bill-wave"></i> Pendapatan Bulan Ini</h4><div class="stat-number">Rp ${pendapatanBulanIni.toLocaleString()}</div><div class="stat-desc">${bulanIni}</div></div>
            </div>
            <div class="card-panel">
                <div class="card-header"><h3><i class="fas fa-chart-line"></i> Ringkasan Aktifitas</h3></div>
                <p>Total penyewa aktif: ${kostData.penyewa.length} orang | Total transaksi tercatat: ${kostData.transaksi.length}</p>
                <hr style="margin:1rem 0">
                <div><i class="fas fa-info-circle"></i> Sistem siap pakai, kelola kamar & penyewa dengan mudah.</div>
            </div>
        `;
        container.innerHTML = html;
    }
    let editKamarTemp = null;
    function renderKamarPage(container) {
        const kamarList = [...kostData.kamar];
        let formHtml = `
            <div class="card-panel">
                <div class="card-header"><h3> ${editKamarTemp ? 'Edit Kamar' : 'Tambah Kamar'}</h3></div>
                <div class="form-row">
                    <div class="form-group"><input type="text" id="kamarNomor" placeholder="Nomor Kamar (Contoh: C3)" value="${editKamarTemp ? editKamarTemp.nomor : ''}"></div>
                    <div class="form-group"><input type="number" id="kamarHarga" placeholder="Harga per bulan" value="${editKamarTemp ? editKamarTemp.harga : ''}"></div>
                    <div class="form-group"><button id="simpanKamarBtn" class="btn-primary"><i class="fas fa-save"></i> ${editKamarTemp ? 'Update' : 'Simpan'}</button>
                    ${editKamarTemp ? `<button id="batalEditKamar" class="btn-primary btn-warning" style="background:#6c757d;">Batal</button>` : ''}</div>
                </div>
            </div>
            <div class="card-panel">
                <div class="card-header"><h3><i class="fas fa-table-list"></i> Daftar Kamar</h3></div>
                <table>
                    <thead><tr><th>No Kamar</th><th>Harga</th><th>Status</th><th>Penyewa</th><th>Aksi</th></tr></thead>
                    <tbody>
                        ${kamarList.map(k => {
                            const penyewaNama = k.penyewaId ? (getPenyewaById(k.penyewaId)?.nama || '-') : '-';
                            return `<tr>
                                <td>${k.nomor}</td><td>Rp ${k.harga.toLocaleString()}</td>
                                <td><span class="badge ${k.status === 'terisi' ? 'badge-success' : ''}">${k.status === 'terisi' ? 'Terisi' : 'Kosong'}</span></td>
                                <td>${penyewaNama}</td>
                                <td class="action-icons">
                                    <i class="fas fa-edit" onclick="editKamarAction('${k.id}')"></i>
                                    <i class="fas fa-trash-alt" style="color:#ef4444;" onclick="hapusKamarAction('${k.id}')"></i>
                                </td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        `;
        container.innerHTML = formHtml;
        document.getElementById("simpanKamarBtn")?.addEventListener("click", function() {
            const nomor = document.getElementById("kamarNomor").value.trim();
            const harga = parseInt(document.getElementById("kamarHarga").value);
            if(!nomor || isNaN(harga)) { alert("Isi nomor dan harga dengan benar"); return; }
            if(editKamarTemp) {
                editKamarTemp.nomor = nomor;
                editKamarTemp.harga = harga;
                saveData();
                editKamarTemp = null;
            } else {
                const newId = "k" + Date.now();
                kostData.kamar.push({ id: newId, nomor, harga, status: "kosong", penyewaId: null });
                saveData();
            }
            renderKamarPage(container);
        });
        const batalBtn = document.getElementById("batalEditKamar");
        if(batalBtn) batalBtn.onclick = () => { editKamarTemp = null; renderKamarPage(container); };
        window.editKamarAction = (id) => {
            editKamarTemp = kostData.kamar.find(k => k.id === id);
            renderKamarPage(container);
        };
        window.hapusKamarAction = (id) => {
            if(confirm("Hapus kamar? Semua penyewa yang terkait akan kehilangan referensi.")) {
                kostData.kamar = kostData.kamar.filter(k => k.id !== id);
                kostData.penyewa = kostData.penyewa.filter(p => p.kamarId !== id);
                saveData();
                renderKamarPage(container);
            }
        };
    }
    let editPenyewaTemp = null;
    function renderPenyewaPage(container) {
        const kamarOptions = kostData.kamar.filter(k => k.status === "kosong" || (editPenyewaTemp && editPenyewaTemp.kamarId === k.id)).map(k => `<option value="${k.id}" ${editPenyewaTemp?.kamarId === k.id ? 'selected' : ''}>${k.nomor} (${k.harga.toLocaleString()})</option>`);
        const html = `
            <div class="card-panel">
                <div class="card-header"><h3><i class="fas fa-user-plus"></i> ${editPenyewaTemp ? 'Edit Penyewa' : 'Tambah Penyewa'}</h3></div>
                <div class="form-row">
                    <div class="form-group"><input id="penyewaNama" placeholder="Nama Lengkap" value="${editPenyewaTemp?.nama || ''}"></div>
                    <div class="form-group"><input id="penyewaHp" placeholder="No HP" value="${editPenyewaTemp?.noHp || ''}"></div>
                    <div class="form-group"><input id="penyewaTgl" type="date" value="${editPenyewaTemp?.tglMasuk || ''}"></div>
                    <div class="form-group"><select id="penyewaKamar"><option value="">-- Pilih Kamar --</option>${kamarOptions}</select></div>
                    <div><button id="simpanPenyewaBtn" class="btn-primary">Simpan</button> ${editPenyewaTemp ? `<button id="batalPenyewa" class="btn-primary btn-warning" style="background:#6c757d;">Batal</button>` : ''}</div>
                </div>
            </div>
            <div class="card-panel">
                <h3>Daftar Penyewa Aktif</h3>
                <table><thead><tr><th>Nama</th><th>Kamar</th><th>No HP</th><th>Tgl Masuk</th><th>Aksi</th></tr></thead><tbody>
                    ${kostData.penyewa.map(p => {
                        const kamar = getKamarById(p.kamarId);
                        return `<tr><td>${p.nama}</td><td>${kamar?.nomor || 'Tidak ada'}</td><td>${p.noHp}</td><td>${p.tglMasuk}</td>
                        <td class="action-icons"><i class="fas fa-edit" onclick="editPenyewa('${p.id}')"></i> <i class="fas fa-trash-alt" style="color:#ef4444;" onclick="hapusPenyewa('${p.id}')"></i></td></tr>`;
                    }).join('')}
                </tbody></table>
            </div>
        `;
        container.innerHTML = html;
        document.getElementById("simpanPenyewaBtn")?.addEventListener("click", ()=>{
            const nama = document.getElementById("penyewaNama").value.trim();
            const hp = document.getElementById("penyewaHp").value;
            const tgl = document.getElementById("penyewaTgl").value;
            const kamarId = document.getElementById("penyewaKamar").value;
            if(!nama || !hp || !tgl || !kamarId) { alert("Isi semua data dan pilih kamar!"); return; }
            const selectedKamar = kostData.kamar.find(k => k.id === kamarId);
            if(selectedKamar.status === "terisi" && (!editPenyewaTemp || editPenyewaTemp.kamarId !== kamarId)) {
                alert("Kamar sudah terisi oleh penyewa lain!"); return;
            }
            if(editPenyewaTemp) {
                editPenyewaTemp.nama = nama; editPenyewaTemp.noHp = hp; editPenyewaTemp.tglMasuk = tgl;
                const oldKamar = editPenyewaTemp.kamarId;
                if(oldKamar !== kamarId) {
                    const oldKamarObj = kostData.kamar.find(k => k.id === oldKamar);
                    if(oldKamarObj) { oldKamarObj.status = "kosong"; oldKamarObj.penyewaId = null; }
                    editPenyewaTemp.kamarId = kamarId;
                    selectedKamar.status = "terisi"; selectedKamar.penyewaId = editPenyewaTemp.id;
                }
                saveData();
                editPenyewaTemp = null;
            } else {
                const newId = "p" + Date.now();
                const newPenyewa = { id: newId, nama, noHp: hp, kamarId, tglMasuk: tgl };
                kostData.penyewa.push(newPenyewa);
                const kamar = kostData.kamar.find(k => k.id === kamarId);
                if(kamar) { kamar.status = "terisi"; kamar.penyewaId = newId; }
                saveData();
            }
            renderPenyewaPage(container);
        });
        if(document.getElementById("batalPenyewa")) document.getElementById("batalPenyewa").onclick = () => { editPenyewaTemp = null; renderPenyewaPage(container); };
        window.editPenyewa = (id) => { editPenyewaTemp = kostData.penyewa.find(p => p.id === id); renderPenyewaPage(container); };
        window.hapusPenyewa = (id) => {
            if(confirm("Hapus penyewa? Kamar akan dikosongkan")){
                const penyewa = kostData.penyewa.find(p => p.id === id);
                if(penyewa) {
                    const kamar = kostData.kamar.find(k => k.id === penyewa.kamarId);
                    if(kamar){ kamar.status = "kosong"; kamar.penyewaId = null; }
                    kostData.penyewa = kostData.penyewa.filter(p => p.id !== id);
                    saveData();
                    renderPenyewaPage(container);
                }
            }
        };
    }
    function renderTransaksiPage(container) {
        const penyewaList = kostData.penyewa;
        const html = `
            <div class="card-panel">
                <h3><i class="fas fa-receipt"></i> Catat Pembayaran</h3>
                <div class="form-row">
                    <select id="transPenyewa"><option value="">-- Pilih Penyewa --</option>${penyewaList.map(p => <option value="${p.id}">${p.nama}</option>)}</select>
                    <input id="transBulan" placeholder="Bulan" value="${new Date().toLocaleString('id', { month: 'long', year: 'numeric' })}">
                    <input id="transJumlah" type="number" placeholder="Jumlah Bayar">
                    <button id="tambahTransaksiBtn" class="btn-primary">Tambah Transaksi</button>
                </div>
            </div>
            <div class="card-panel">
                <h3>Riwayat Transaksi</h3>
                <table><thead><tr><th>Penyewa</th><th>Bulan</th><th>Jumlah</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
                    ${kostData.transaksi.map(t => {
                        const penyewa = getPenyewaById(t.penyewaId);
                        return `<tr><td>${penyewa?.nama || '-'}</td><td>${t.bulan}</td><td>Rp ${t.jumlah.toLocaleString()}</td><td><span class="badge ${t.status === 'Lunas' ? 'badge-success' : ''}">${t.status}</span></td>
                        <td><i class="fas fa-check-circle" style="color:green; cursor:pointer;" onclick="lunaskanTransaksi('${t.id}')"></i> <i class="fas fa-trash-alt" style="color:red;cursor:pointer;" onclick="hapusTransaksi('${t.id}')"></i></td></tr>`;
                    }).join('')}
                </tbody></table>
            </div>
        `;
        container.innerHTML = html;
        document.getElementById("tambahTransaksiBtn")?.addEventListener("click", () => {
            const penyewaId = document.getElementById("transPenyewa").value;
            const bulan = document.getElementById("transBulan").value;
            const jumlah = parseInt(document.getElementById("transJumlah").value);
            if(!penyewaId || !bulan || isNaN(jumlah)) { alert("Lengkapi data!"); return; }
            const newId = "t"+Date.now();
            kostData.transaksi.push({ id: newId, penyewaId, bulan, jumlah, status: "Belum Lunas", tglBayar: null });
            saveData();
            renderTransaksiPage(container);
        });
        window.lunaskanTransaksi = (id) => {
            const trans = kostData.transaksi.find(t => t.id === id);
            if(trans) { trans.status = "Lunas"; trans.tglBayar = new Date().toISOString().slice(0,10); saveData(); renderTransaksiPage(container); }
        };
        window.hapusTransaksi = (id) => {
            kostData.transaksi = kostData.transaksi.filter(t => t.id !== id);
            saveData();
            renderTransaksiPage(container);
        };
    }

    function initApp() {
        loadData();
        const loginDiv = document.getElementById("loginPage");
        const dashboardDiv = document.getElementById("dashboardApp");
        const loginForm = document.getElementById("loginForm");
        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            if((user === "admin" && pass === "admin123") || (user && pass)) { // demo fleksibel
                loginDiv.style.display = "none";
                dashboardDiv.style.display = "block";
                render();
            } else {
                alert("Login gagal! Gunakan admin/admin123");
            }
        });
        document.getElementById("logoutSidebar").addEventListener("click", () => {
            dashboardDiv.style.display = "none";
            loginDiv.style.display = "flex";
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        });
        
        document.querySelectorAll(".nav-item").forEach(item => {
            item.addEventListener("click", (e) => {
                document.querySelectorAll(".nav-item").forEach(nav => nav.classList.remove("active"));
                item.classList.add("active");
                currentPage = item.getAttribute("data-page");
                render();
            });
        });
    }
    window.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
</html
